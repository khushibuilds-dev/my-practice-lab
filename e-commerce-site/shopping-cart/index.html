<html lang="en">

</head>
<body>
    <header>
    <div class="container">

       <nav>
        <li><a href="#">Home</a></li>

           </div>

            <p>$120.00</p>
            <button>Add to Cart</button>
           </div>
           <div class="product-card">
            <img src="https://placehold.co/300x200" alt="Product 3">

            <p>$299.99</p>
            <button>Add to Cart</button>
           </div>
        </div>
    </section>
</main>
