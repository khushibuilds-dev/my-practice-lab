<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guess Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to Number Guess Game</h1>
  <div class = "gameBox">
    <p>Computer ne ek number soch liya hai kya aap bta sakte ho ki vo kya hai?</p>
    <p>Hint: Number 1 se 50 ke beech ka hi hai. Dimag lagao tukka maro.</p>
    <input type = "text" id = "userguess" placeholder = "enter your number">
    <button id = "check">Check</button>
  
  <div class = "messageBox">
    <h3 id="message"> Apna pahela andaza lago</h3>
  </div>
  </div>
  <script src = "script.js"></script>
</body>
</html>
